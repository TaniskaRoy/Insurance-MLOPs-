<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="tileShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="880" height="340" rx="16" fill="url(#bgCard)" stroke="#334155" stroke-width="1.5"/>

  <!-- Row 1 -->
  <g transform="translate(30, 30)" filter="url(#tileShadow)">
    <rect width="150" height="85" rx="10" fill="url(#tileGrad)" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="75" cy="30" r="14" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="75" y="35" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="14" fill="#38bdf8" font-weight="700">PY</text>
    <text x="75" y="58" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="13" fill="#f8fafc" font-weight="600">Python</text>
    <text x="75" y="73" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="10" fill="#94a3b8">Language</text>
  </g>

  <g transform="translate(195, 30)" filter="url(#tileShadow)">
    <rect width="150" height="85" rx="10" fill="url(#tileGrad)" stroke="#818cf8" stroke-width="1.2"/>
    <circle cx="75" cy="30" r="14" fill="#818cf8" fill-opacity="0.15"/>
    <text x="75" y="35" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="14" fill="#818cf8" font-weight="700">PD</text>
    <text x="75" y="58" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="13" fill="#f8fafc" font-weight="600">Pandas</text>
    <text x="75" y="73" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="10" fill="#94a3b8">Data Processing</text>
  </g>

  <g transform="translate(360, 30)" filter="url(#tileShadow)">
    <rect width="150" height="85" rx="10" fill="url(#tileGrad)" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="75" cy="30" r="14" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="75" y="35" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="14" fill="#f59e0b" font-weight="700">SK</text>
    <text x="75" y="58" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="13" fill="#f8fafc" font-weight="600">Scikit-Learn</text>
    <text x="75" y="73" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="10" fill="#94a3b8">Model Building</text>
  </g>

  <g transform="translate(525, 30)" filter="url(#tileShadow)">
    <rect width="150" height="85" rx="10" fill="url(#tileGrad)" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="75" cy="30" r="14" fill="#10b981" fill-opacity="0.15"/>
    <text x="75" y="35" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="14" fill="#10b981" font-weight="700">FL</text>
    <text x="75" y="58" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="13" fill="#f8fafc" font-weight="600">Flask</text>
    <text x="75" y="73" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="10" fill="#94a3b8">API / Serving</text>
  </g>

  <g transform="translate(690, 30)" filter="url(#tileShadow)">
    <rect width="150" height="85" rx="10" fill="url(#tileGrad)" stroke="#4ade80" stroke-width="1.2"/>
    <circle cx="75" cy="30" r="14" fill="#4ade80" fill-opacity="0.15"/>
    <text x="75" y="35" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="14" fill="#4ade80" font-weight="700">MG</text>
    <text x="75" y="58" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="13" fill="#f8fafc" font-weight="600">MongoDB Atlas</text>
    <text x="75" y="73" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="10" fill="#94a3b8">Database</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(112, 160)" filter="url(#tileShadow)">
    <rect width="150" height="85" rx="10" fill="url(#tileGrad)" stroke="#f97316" stroke-width="1.2"/>
    <circle cx="75" cy="30" r="14" fill="#f97316" fill-opacity="0.15"/>
    <text x="75" y="35" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="14" fill="#f97316" font-weight="700">S3</text>
    <text x="75" y="58" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="13" fill="#f8fafc" font-weight="600">AWS S3</text>
    <text x="75" y="73" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="10" fill="#94a3b8">Model Registry</text>
  </g>

  <g transform="translate(277, 160)" filter="url(#tileShadow)">
    <rect width="150" height="85" rx="10" fill="url(#tileGrad)" stroke="#0284c7" stroke-width="1.2"/>
    <circle cx="75" cy="30" r="14" fill="#0284c7" fill-opacity="0.15"/>
    <text x="75" y="35" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="14" fill="#0284c7" font-weight="700">DK</text>
    <text x="75" y="58" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="13" fill="#f8fafc" font-weight="600">Docker</text>
    <text x="75" y="73" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="10" fill="#94a3b8">Containers</text>
  </g>

  <g transform="translate(442, 160)" filter="url(#tileShadow)">
    <rect width="150" height="85" rx="10" fill="url(#tileGrad)" stroke="#fb923c" stroke-width="1.2"/>
    <circle cx="75" cy="30" r="14" fill="#fb923c" fill-opacity="0.15"/>
    <text x="75" y="35" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="14" fill="#fb923c" font-weight="700">ECR</text>
    <text x="75" y="58" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="13" fill="#f8fafc" font-weight="600">AWS ECR</text>
    <text x="75" y="73" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="10" fill="#94a3b8">Image Registry</text>
  </g>

  <g transform="translate(607, 160)" filter="url(#tileShadow)">
    <rect width="150" height="85" rx="10" fill="url(#tileGrad)" stroke="#eab308" stroke-width="1.2"/>
    <circle cx="75" cy="30" r="14" fill="#eab308" fill-opacity="0.15"/>
    <text x="75" y="35" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="14" fill="#eab308" font-weight="700">EC2</text>
    <text x="75" y="58" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="13" fill="#f8fafc" font-weight="600">AWS EC2</text>
    <text x="75" y="73" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="10" fill="#94a3b8">Cloud Hosting</text>
  </g>

  <!-- CI/CD Footer Strip -->
  <g transform="translate(250, 270)">
    <rect width="380" height="40" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
    <text x="190" y="25" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial" font-size="13" fill="#c7d2fe" font-weight="600">Automated with GitHub Actions CI/CD Pipeline</text>
  </g>
</svg>
